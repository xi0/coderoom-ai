<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coderoom AI</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="logo.png">
  <script src="/wasm_exec.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <!-- Line 1 -->
      <div class="top-bar-line1">
        <div class="brand">
          <img src="logo.png" alt="Coderoom AI Logo" class="logo" />
          <span class="brand-title">Coderoom AI</span>
        </div>
        <div class="actions">
          <button id="mode-toggle" class="icon-btn" aria-label="Modification mode: Modifications allowed" title="Modification mode: Modifications allowed" data-mode="modify">
            <svg class="modify-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            <svg class="inspect-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button id="reset-session-btn" class="icon-btn" aria-label="Reset session" title="Reset session">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
            <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          
          <div class="settings-dropdown-wrapper">
            <button id="settings-toggle" class="icon-btn" aria-label="Settings" title="Settings">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <div id="settings-menu" class="settings-menu hidden">
              <button class="menu-item" type="button">Global settings</button>
              <button class="menu-item" type="button">Project settings</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Line 2 -->
      <div class="top-bar-line2">
        <span id="project-name">-</span>
        <span id="project-dir">-</span>
      </div>
    </header>

    <!-- Chat Area -->
    <main class="chat-container">
      <div class="chat-conversation">
        <div class="message system-message working-message" id="working-message">
          <div class="message-content">
            <div class="working-header">
              <span class="gear-icon">⚙</span>
              <span class="message-text">Initializing...</span>
            </div>
            <div class="progress-container">
              <div id="working-progress" class="progress-bar" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Input Footer -->
    <footer class="input-container">
      <div class="input-wrapper">
        <textarea id="prompt-input" rows="1" placeholder="Type your prompt here..." disabled></textarea>
        <button id="send-btn" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <dialog closedby="any" id="global-settings">
    <h2>Global Settings</h2>
    <form method="dialog">
      <textarea rows="5" cols="100"></textarea><br />
      <button>Save config</button>
    </form>
  </dialog>

  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("/main.wasm"), go.importObject)
    .then((result) => {
        go.run(result.instance);
    })
    .catch((err) => {
        console.error("Failed to load Wasm:", err);
    });
  </script>
</body>
</html>
